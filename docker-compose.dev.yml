# -----------------------------------------------------------------------------
# Dev server (192.168.24.254) — requires docker-compose v1 (hyphen), NOT "docker compose"
#
#   cp env.dev.example .env && nano .env
#   chmod +x dev-up.sh
#   ./dev-up.sh up -d --build
#
# Or directly:
#   docker-compose -f docker-compose.dev.yml up -d --build
#
# Secrets (MYSQL_*) must be set in .env — never hardcoded in this file.
# -----------------------------------------------------------------------------

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: mysql:8.0.42
    container_name: idp-mysql
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: lilg
      MYSQL_USER: lilg_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - idp-net

  redis:
    image: redis:7.4.3-alpine
    container_name: idp-redis
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - SETGID
      - SETUID
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - idp-net

  localstack:
    image: localstack/localstack:4.3.0
    container_name: idp-localstack
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      SERVICES: sqs
      DEFAULT_REGION: ap-south-1
      LOCALSTACK_HOSTNAME: localstack
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - idp-net

  lilg-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: idp-api
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      HTTPS_PORT: 8443
      DB_HOST: mysql
      SAML_KEY_DIR: /app/data/saml
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - "0.0.0.0:8080:8080"
      # Host :443 required for Cloudflare Full SSL → container HTTPS :8443
      # (Checkmarx flags privileged ports; accepted for edge IdP — do not remove)
      - "0.0.0.0:443:8443"
      - "0.0.0.0:8443:8443"
      # RADIUS UDP (standard 1812; privileged host port accepted for VPN AAA)
      - "0.0.0.0:1812:1812/udp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - saml-keys:/app/data/saml
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - idp-net

  lilg-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: idp-worker
    restart: unless-stopped
    <<: *default-security
    command: ["node", "dist/services/outbox-worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      SAML_KEY_DIR: /app/data/saml
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-net

networks:
  idp-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  localstack-data:
  saml-keys:
