<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 system-ui, Segoe UI, sans-serif;
      color: var(--text);
      background: var(--bg);
      width: 360px;
      padding: 14px;
    }
    h1 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
    .ver { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2a3542;
      background: var(--card);
      color: var(--text);
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      margin-bottom: 8px;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    #status {
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--card);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: auto;
    }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    .note {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid #2a3542;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <h1>IdP App Discovery</h1>
  <div class="ver">Extension v1.2.0</div>
  <p>Stay signed in to the IdP, then sync. You can also use <strong>Scan from browser</strong> on the Discovery page.</p>

  <label for="idp">IdP base URL</label>
  <input id="idp" type="url" placeholder="https://idp.lenskart.com" />

  <button id="scan">Scan &amp; sync to Discovery</button>

  <div id="status">Checking this browser…</div>
  <div class="note">
    Uses Chrome history + open tabs (not HTTP disk cache). After sync, open
    Applications → Discovery to review findings.
  </div>
  <script src="popup.js"></script>
</body>
</html>
