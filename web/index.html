<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenskart IdP — Identity & Access Management</title>
  <meta name="theme-color" content="#0f172a" />
  <script>
    (function () {
      var k = 'idp_theme', t = localStorage.getItem(k) || 'light';
      var ok = ['light', 'dark', 'ocean', 'slate', 'violet'].indexOf(t) >= 0;
      document.documentElement.setAttribute('data-theme', ok ? t : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=2026-06-07-themes" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/app.js?v=2026-06-07-themes"></script>
</body>
</html>
