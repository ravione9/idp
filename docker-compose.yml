version: "3.9"

# =============================================================================
# LILG — Local development stack
# Secrets come from the environment / .env (never hardcoded here).
# =============================================================================

networks:
  lilg-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  localstack-data:
  saml-keys:

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: false

services:
  # ---------------------------------------------------------------------------
  # MySQL 8
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.42
    container_name: lilg-mysql
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: lilg
      MYSQL_USER: lilg_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lilg-net

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.3-alpine
    container_name: lilg-redis
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - SETGID
      - SETUID
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lilg-net

  # ---------------------------------------------------------------------------
  # LocalStack (SQS emulation)
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.3.0
    container_name: lilg-localstack
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      SERVICES: sqs
      DEFAULT_REGION: ap-south-1
      LOCALSTACK_HOSTNAME: localstack
      PERSISTENCE: 1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lilg-net

  # ---------------------------------------------------------------------------
  # LILG API server
  # ---------------------------------------------------------------------------
  lilg-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lilg-api
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      HTTPS_PORT: 8443
      DB_HOST: mysql
      SAML_KEY_DIR: /app/data/saml
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
      # Production: set in .env — PUBLIC_BASE_URL=https://idp.lenskart.com
    ports:
      # Non-privileged host ports (Checkmarx). Terminate TLS on 443 via reverse proxy if needed.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - saml-keys:/app/data/saml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - lilg-net

  # ---------------------------------------------------------------------------
  # LILG Outbox worker (separate process)
  # ---------------------------------------------------------------------------
  lilg-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lilg-worker
    restart: unless-stopped
    <<: *default-security
    command: ["node", "dist/services/outbox-worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lilg-net
